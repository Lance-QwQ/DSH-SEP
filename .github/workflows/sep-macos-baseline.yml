name: SEP macOS owner-lock adaptation
on:
  push:
    branches: ['codex/sep-cross-platform-20260929']
    paths: ['tools/cross-platform/**', '.github/workflows/sep-macos-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Verify exact source and syntax
        run: node tools/cross-platform/verify-source.mjs --candidate
      - name: Original budget arithmetic tests
        run: node --test tools/cross-platform/candidate-r1/packages/sep/system-enhancement-package/tests/budget-pricing.test.mjs
      - name: Owner identity and interrupted-publication tests
        run: |
          set -o pipefail
          node --test tools/cross-platform/candidate-r1/packages/sep/system-enhancement-package/tests/owner-portability.test.mjs | tee "$RUNNER_TEMP/sep-owner-tests.log"
      - name: Native storage and recovery integration
        if: always()
        env:
          SEP_PLATFORM_SOURCE: tools/cross-platform/candidate-r1
          SEP_PLATFORM_WORK: ${{ runner.temp }}
          SEP_PLATFORM_RESULT: ${{ runner.temp }}/sep-platform-baseline.json
        run: node tools/cross-platform/platform-probe.mjs
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-owner-r1-integration
          path: |
            ${{ runner.temp }}/sep-platform-baseline.json
            ${{ runner.temp }}/sep-owner-tests.log
          if-no-files-found: error
          retention-days: 7
