name: SEP Alpha.2 macOS corrected native lifecycle probes
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-hide-effect-product:
    runs-on: macos-15
    timeout-minutes: 28
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Verify actual-sample observation and origin contracts (12)
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/"
          node --test --test-reporter=tap tools/alpha2-macos/desktop/hide-effect-probe/observation.test.mjs tools/alpha2-macos/desktop/hide-effect-probe/derive.test.mjs > "$RUNNER_TEMP/hide-effect-contracts.tap"
      - name: Restore fixed r44 bytes without rebuild or signing changes
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/package/restore-fixed-application-r44.mjs "$RUNNER_TEMP/hide-effect-r44"
      - name: Three distinct normal LaunchServices cycles with one hide each
        run: node tools/alpha2-macos/desktop/hide-effect-probe/run-product.mjs "$RUNNER_TEMP/hide-effect-r44" "$RUNNER_TEMP/hide-effect-product"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-hide-effect-product
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hide-effect-contracts.tap
            ${{ runner.temp }}/hide-effect-product
            ${{ runner.temp }}/hide-effect-r44/RESULT.json
            ${{ runner.temp }}/hide-effect-r44/PACKAGE-INVENTORY.json
            ${{ runner.temp }}/hide-effect-r44/*.log

  native-full-first-install:
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Fixed manifest profile path regression contracts (six)
        run: node --test --test-reporter=tap tools/alpha2-macos/package/installed-profile-binding.test.mjs > "$RUNNER_TEMP/installed-profile-binding.tap"
      - name: Restore exact unchanged r44 complete app
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/package/restore-fixed-application-r44.mjs "$RUNNER_TEMP/application-build"
      - name: Verify source derivation for the separate narrow installed startup test
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const base='tools/alpha2-macos/package/',m=JSON.parse(fs.readFileSync(base+'exercise-installed-startup.origin.json')),h=s=>createHash('sha256').update(s).digest('hex');let s=fs.readFileSync(base+m.source,'utf8');assert.equal(h(s),m.sourceSha256);for(const t of m.transforms){assert.equal(s.split(t.before).length,2);s=s.replace(t.before,t.after);}assert.equal(h(s),m.resultSha256);assert.equal(s,fs.readFileSync(base+m.result,'utf8'));console.log(JSON.stringify({status:'pass',transforms:m.transforms.length,scope:m.scope}));
          NODE
      - name: Install full app to final fresh account path without starting it
        run: node tools/alpha2-macos/installation/full-package-install.mjs "$RUNNER_TEMP/application-build" "$RUNNER_TEMP/full-first-install" > "$RUNNER_TEMP/full-first-install-runner.log" 2>&1
      - name: Separate installed first boot and restart with final-path Profile binding
        run: node tools/alpha2-macos/package/exercise-installed-startup.mjs "$RUNNER_TEMP/full-first-install" "$RUNNER_TEMP/installed-startup" > "$RUNNER_TEMP/installed-startup-runner.log" 2>&1
      - name: Preserve full-package installation and narrow startup outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-full-first-install-r49
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installed-profile-binding.tap
            ${{ runner.temp }}/application-build/RESULT.json
            ${{ runner.temp }}/application-build/*.log
            ${{ runner.temp }}/full-first-install/*.json
            ${{ runner.temp }}/full-first-install/*.log
            ${{ runner.temp }}/full-first-install-runner.log
            ${{ runner.temp }}/installed-startup/*.json
            ${{ runner.temp }}/installed-startup/*.jsonl
            ${{ runner.temp }}/installed-startup/*.log
            ${{ runner.temp }}/installed-startup-runner.log
