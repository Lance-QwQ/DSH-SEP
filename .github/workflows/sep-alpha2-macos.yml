name: SEP Alpha.2 macOS native foundation
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-connected-bootstrap:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Non-test connected entry with synthetic controller and actual normal quit
        run: node tools/alpha2-macos/bootstrap/run-connected-native.mjs "$RUNNER_TEMP/bootstrap-connected"
      - name: Preserve original outcomes without rewriting expected RED as pass
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-connected-bootstrap
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bootstrap-connected/RESULT.json
            ${{ runner.temp }}/bootstrap-connected/*.log
            ${{ runner.temp }}/bootstrap-connected/cases/**/*.log
            ${{ runner.temp }}/bootstrap-connected/cases/**/cleanup.json

  native-bootstrap-production-admission:
    runs-on: macos-15
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Native non-test binary admission, identity placeholders never executed
        run: node tools/alpha2-macos/bootstrap/run-production-native.mjs "$RUNNER_TEMP/bootstrap-production-native"
      - name: Preserve original outcomes including planned missing-feature RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-bootstrap-production-admission
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bootstrap-production-native/RESULT.json
            ${{ runner.temp }}/bootstrap-production-native/*.log
            ${{ runner.temp }}/bootstrap-production-native/cases/**/*.log
  
  native-product-control-contracts:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Fixed inputs and isolated native contract directories
        id: inputs
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          root="$(cd "$RUNNER_TEMP" && pwd -P)/product-control-contracts"
          mkdir -m 700 "$root"
          mkdir -m 700 "$root/tmp" "$root/product-tests" "$root/broker-tests"
          echo "SEP_PRODUCT_CI_OUTPUT=$root" >> "$GITHUB_ENV"
          echo "SEP_PRODUCT_TEST_ROOT=$root/product-tests" >> "$GITHUB_ENV"
          echo "SEP_DESKTOP_TEST_ROOT=$root/broker-tests" >> "$GITHUB_ENV"
          echo "SEP_PRODUCT_OWNER_MODULE=$GITHUB_WORKSPACE/tools/alpha2-macos/captured/owner-lease.mjs" >> "$GITHUB_ENV"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "TMP=$root/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$root/tmp" >> "$GITHUB_ENV"
          sw_vers > "$root/system.txt"
          uname -a >> "$root/system.txt"
          SEP_PRODUCT_CI_OUTPUT="$root" node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import{createHash}from'node:crypto';import{execFileSync}from'node:child_process';
          const out=process.env.SEP_PRODUCT_CI_OUTPUT,base=path.join(process.env.GITHUB_WORKSPACE,'tools/alpha2-macos'),hash=b=>createHash('sha256').update(b).digest('hex');
          const files=['bootstrap/controller.mjs','captured/owner-lease.mjs','captured/owner-posix.mjs'];
          for(const dir of ['desktop/product-control','desktop/managed-broker'])for(const name of fs.readdirSync(path.join(base,dir)).sort())if(fs.statSync(path.join(base,dir,name)).isFile())files.push(dir+'/'+name);
          const inputs=files.sort().map(name=>{const bytes=fs.readFileSync(path.join(base,name));return{path:name,bytes:bytes.length,sha256:hash(bytes)};});
          const expected={'captured/owner-lease.mjs':'33071ae2632f2cdfe113267757412de089ebe065699bf93ed1aa291af9fbbb4a','captured/owner-posix.mjs':'bb4d6a89d85fbcf10e4b3e72c0e81e13dfbbd39068a0506f486edcadb38353c3'};
          for(const[name,sha]of Object.entries(expected))if(inputs.find(x=>x.path===name)?.sha256!==sha)throw Error('SEP_PRODUCT_CAPTURE_CHANGED');
          const platform={platform:process.platform,arch:process.arch,node:process.version,nodeSha256:hash(fs.readFileSync(process.execPath)),macOSVersion:execFileSync('/usr/bin/sw_vers',['-productVersion'],{encoding:'utf8'}).trim(),macOSBuild:execFileSync('/usr/bin/sw_vers',['-buildVersion'],{encoding:'utf8'}).trim()};
          if(platform.platform!=='darwin'||platform.arch!=='arm64')throw Error('SEP_PRODUCT_NATIVE_PLATFORM');
          const receipt={schema:1,scope:'product control contracts only',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,job:process.env.GITHUB_JOB,platform,inputs,inputsSha256:hash(JSON.stringify(inputs))};
          fs.writeFileSync(path.join(out,'INPUTS.json'),JSON.stringify(receipt,null,2)+'\n',{flag:'wx'});
          NODE
      - name: Forty product control definitions
        id: product
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap \
            tools/alpha2-macos/desktop/product-control/controller-bridge.test.mjs \
            tools/alpha2-macos/desktop/product-control/controller-composition.test.mjs \
            tools/alpha2-macos/desktop/product-control/controller-outcome.test.mjs \
            tools/alpha2-macos/desktop/product-control/controller-paths.test.mjs \
            tools/alpha2-macos/desktop/product-control/electron.test.mjs \
            tools/alpha2-macos/desktop/product-control/fixed-program.test.mjs \
            tools/alpha2-macos/desktop/product-control/launch-control.test.mjs \
            tools/alpha2-macos/desktop/product-control/owned-observer.test.mjs \
            tools/alpha2-macos/desktop/product-control/transport.test.mjs \
            > "$SEP_PRODUCT_CI_OUTPUT/product.tap" 2> "$SEP_PRODUCT_CI_OUTPUT/product.stderr.log"
          result=$?
          printf '%s\n' "$result" > "$SEP_PRODUCT_CI_OUTPUT/product.exit"
          exit "$result"
      - name: Thirty existing broker definitions
        id: broker
        if: always() && steps.inputs.outcome == 'success'
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap \
            tools/alpha2-macos/desktop/managed-broker/app-program.test.mjs \
            tools/alpha2-macos/desktop/managed-broker/desktop-rpc.test.mjs \
            tools/alpha2-macos/desktop/managed-broker/host-owner.test.mjs \
            tools/alpha2-macos/desktop/managed-broker/launch-state.test.mjs \
            tools/alpha2-macos/desktop/managed-broker/program-manifest.test.mjs \
            > "$SEP_PRODUCT_CI_OUTPUT/broker.tap" 2> "$SEP_PRODUCT_CI_OUTPUT/broker.stderr.log"
          result=$?
          printf '%s\n' "$result" > "$SEP_PRODUCT_CI_OUTPUT/broker.exit"
          exit "$result"
      - name: Assert complete counts and record exact scope
        if: always() && steps.inputs.outcome == 'success'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from'node:fs';import path from'node:path';import{createHash}from'node:crypto';
          const out=process.env.SEP_PRODUCT_CI_OUTPUT,hash=b=>createHash('sha256').update(b).digest('hex'),inputBytes=fs.readFileSync(path.join(out,'INPUTS.json')),input=JSON.parse(inputBytes);
          function result(name,expected){const file=path.join(out,name+'.tap');if(!fs.existsSync(file))return{status:'not_run',expected};const bytes=fs.readFileSync(file),text=bytes.toString(),counts=Object.fromEntries(['tests','pass','fail','cancelled','skipped','todo'].map(k=>[k,Number(text.match(new RegExp('^# '+k+' (\\d+)$','m'))?.[1]??-1)])),exitPath=path.join(out,name+'.exit'),exit=fs.existsSync(exitPath)?Number(fs.readFileSync(exitPath,'utf8').trim()):null;return{status:exit===0&&counts.tests===expected&&counts.pass===expected&&['fail','cancelled','skipped','todo'].every(k=>counts[k]===0)?'pass':'fail',expected,exit,counts,tapSha256:hash(bytes),stderrSha256:hash(fs.readFileSync(path.join(out,name+'.stderr.log')))};}
          const groups={product:result('product',40),broker:result('broker',30)},receipt={schema:1,status:Object.values(groups).every(x=>x.status==='pass')?'pass':'fail',scope:'native macOS contracts with independent Node fixture children; not assembled Electron/AppKit/Finder validation',commit:input.commit,runId:input.runId,job:input.job,platform:input.platform,inputsReceiptSha256:hash(inputBytes),inputsSha256:input.inputsSha256,expectedDefinitions:70,groups,nativeProduct:{status:'not_run',directLaunchDefinitions:2,electronProduct:'not_run',appkitProduct:'not_run',finder:'not_run'}};
          fs.writeFileSync(path.join(out,'RESULT.json'),JSON.stringify(receipt,null,2)+'\n',{flag:'wx'});console.log(JSON.stringify({status:receipt.status,expectedDefinitions:70,product:groups.product.counts,broker:groups.broker.counts}));if(receipt.status!=='pass')process.exitCode=1;
          NODE
      - name: Preserve contract inputs and result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-product-control-contracts
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/product-control-contracts/*.json
            ${{ runner.temp }}/product-control-contracts/*.tap
            ${{ runner.temp }}/product-control-contracts/*.stderr.log
            ${{ runner.temp }}/product-control-contracts/*.exit
            ${{ runner.temp }}/product-control-contracts/system.txt
  
  native-product-readiness-candidate:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Fixed reviewed carrier and integrity-locked ASAR tooling
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          node tools/alpha2-macos/desktop/managed-overlay/download-carrier.mjs "$RUNNER_TEMP/product-carrier-download"
          mkdir "$RUNNER_TEMP/product-carrier"
          ditto -x -k "$RUNNER_TEMP/product-carrier-download/input/desktop-carrier.zip" "$RUNNER_TEMP/product-carrier"
          node tools/alpha2-macos/desktop/managed-overlay/install-asar-tool.mjs "$RUNNER_TEMP/product-asar-tools"
      - name: Bind actual Mac inputs and reconstruct the frozen workspace and welcome chain
        run: |
          node tools/alpha2-macos/desktop/renderer-readiness/prepare-inputs.mjs \
            "$RUNNER_TEMP/product-carrier/DSH SEP.app" \
            "$GITHUB_WORKSPACE/tools/alpha2-macos/desktop/managed-capture" \
            "$RUNNER_TEMP/product-carrier-download" \
            "$RUNNER_TEMP/product-workspace-inputs" \
            "$RUNNER_TEMP/product-asar-tools/node_modules/@electron/asar/lib/asar.js"
          node tools/alpha2-macos/desktop/renderer-readiness/welcome-prepare-inputs.mjs \
            "$RUNNER_TEMP/product-workspace-inputs" \
            "$GITHUB_WORKSPACE/tools/alpha2-macos/desktop/managed-capture" \
            "$RUNNER_TEMP/product-welcome-inputs"
          node tools/alpha2-macos/desktop/renderer-readiness/welcome-build-candidate.mjs \
            "$RUNNER_TEMP/product-workspace-inputs" \
            "$RUNNER_TEMP/product-welcome-inputs" \
            "$RUNNER_TEMP/product-welcome-base"
      - name: Twenty product adapter and exact application edit contracts
        env:
          SEP_PRODUCT_MAIN_INPUT: ${{ runner.temp }}/product-welcome-base/asar/lib/main.js
          SEP_RENDERER_READINESS_INPUTS: ${{ runner.temp }}/product-workspace-inputs
          SEP_WELCOME_READINESS_INPUTS: ${{ runner.temp }}/product-welcome-inputs
          SEP_PRODUCT_CONTROL_INPUTS: ${{ github.workspace }}/tools/alpha2-macos/desktop/product-control
        run: |
          node --test --test-reporter=tap \
            tools/alpha2-macos/desktop/renderer-readiness/product-window-actions.test.mjs \
            tools/alpha2-macos/desktop/renderer-readiness/product-derive.test.mjs \
            tools/alpha2-macos/desktop/renderer-readiness/product-activation-composition.test.mjs \
            tools/alpha2-macos/desktop/renderer-readiness/application-inputs.test.mjs > "$RUNNER_TEMP/product-tests.tap"
      - name: Construct the product adapter candidate without modifying or launching an app
        run: |
          node tools/alpha2-macos/desktop/renderer-readiness/product-build-candidate.mjs \
            "$RUNNER_TEMP/product-welcome-base/asar/lib/main.js" "$RUNNER_TEMP/product-candidate"
      - name: Bind small evidence and precise native verification scope
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const temp=process.env.RUNNER_TEMP, sha=b=>createHash('sha256').update(b).digest('hex');
          const result={schema:1,status:'fail',scope:'twenty native product adapter contracts bound to actual Mac carrier inputs; no app launch',commit:process.env.GITHUB_SHA,inputs:[],notRun:['previous workspace 28 definitions','previous welcome 28 definitions','actual product ASAR assembly and signing','actual React/Electron readiness and physical focus','Finder launch'],productChanged:false};
          try {
            assert.equal(process.platform,'darwin');assert.equal(process.arch,'arm64');
            for(const path of ['product-carrier-download/DOWNLOAD-RECEIPT.json','product-asar-tools/RESULT.json','product-workspace-inputs/INPUTS.json','product-welcome-inputs/INPUTS.json','product-welcome-base/CANDIDATE.json','product-candidate/CANDIDATE.json']) {
              const bytes=await readFile(join(temp,path)), value=JSON.parse(bytes);
              assert.equal(value.status,'pass');result.inputs.push({path,bytes:bytes.length,sha256:sha(bytes)});
            }
            const log=await readFile(join(temp,'product-tests.tap')), text=log.toString();
            for(const [key,value] of Object.entries({tests:20,pass:20,fail:0,skipped:0,cancelled:0})) assert.match(text,new RegExp('^# '+key+' '+value+'\\r?$','m'));
            result.tests={definitions:20,pass:20,fail:0,skipped:0,logSha256:sha(log)};
            const job=await readFile(join(process.env.GITHUB_WORKSPACE,'tools/alpha2-macos/desktop/renderer-readiness/product-ci-job.yml'));
            result.jobSha256=sha(job);result.status='pass';
          } catch(error) {result.code='SEP_PRODUCT_NATIVE_EVIDENCE_INCOMPLETE';result.errorType=error.name;process.exitCode=1;}
          await writeFile(join(temp,'PRODUCT-RESULT.json'),JSON.stringify(result,null,2)+'\n',{flag:'wx',mode:0o600});
          console.log(JSON.stringify({status:result.status,tests:result.tests,code:result.code}));
          NODE
      - name: Preserve small exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-product-readiness-candidate
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/PRODUCT-RESULT.json
            ${{ runner.temp }}/product-tests.tap
            ${{ runner.temp }}/product-candidate/
            ${{ runner.temp }}/product-workspace-inputs/INPUTS.json
            ${{ runner.temp }}/product-workspace-inputs/signature.log
            ${{ runner.temp }}/product-welcome-inputs/INPUTS.json
            ${{ runner.temp }}/product-welcome-base/CANDIDATE.json
            ${{ runner.temp }}/product-carrier-download/DOWNLOAD-RECEIPT.json
            ${{ runner.temp }}/product-asar-tools/RESULT.json
  
  native-integrated-application:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Restore and verify fixed r33 product input
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/package/restore-app-base.mjs "$RUNNER_TEMP/application-base"
      - name: Install the integrity-pinned pure JS ASAR tool
        run: node tools/alpha2-macos/desktop/managed-overlay/install-asar-tool.mjs "$RUNNER_TEMP/application-asar-tool"
      - name: Derive and sign fresh fixed-layout app, then verify its archive restore
        id: assembly
        run: |
          node tools/alpha2-macos/package/assemble-application.mjs \
            "$RUNNER_TEMP/application-base" \
            "$GITHUB_WORKSPACE/tools/alpha2-macos" \
            "$GITHUB_WORKSPACE/tools/alpha2-macos/desktop/managed-capture" \
            "$RUNNER_TEMP/application-asar-tool/node_modules/@electron/asar/lib/asar.js" \
            "$RUNNER_TEMP/application-build"
      - name: Two direct launch definitions against the assembled and restored application
        run: |
          receipt="$RUNNER_TEMP/application-build/RESULT.json"
          expected_sha=$(shasum -a 256 "$receipt" | cut -d ' ' -f 1)
          node tools/alpha2-macos/desktop/product-control/native-launch-runner.mjs \
            "$receipt" "$expected_sha" "$RUNNER_TEMP/application-native-preflight"
      - name: Actual LaunchServices lifecycle without Inspector or model requests
        run: node tools/alpha2-macos/package/exercise-application.mjs "$RUNNER_TEMP/application-build" "$RUNNER_TEMP/application-lifecycle"
      - name: Preserve exact outcomes and evidence, even when integration fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-integrated-application-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/application-base/RESULT.json
            ${{ runner.temp }}/application-base/*.log
            ${{ runner.temp }}/application-asar-tool/RESULT.json
            ${{ runner.temp }}/application-build/RESULT.json
            ${{ runner.temp }}/application-build/PACKAGE-INVENTORY.json
            ${{ runner.temp }}/application-build/*.log
            ${{ runner.temp }}/application-build/draft/APP-DRAFT.json
            ${{ runner.temp }}/application-build/draft/*.log
            ${{ runner.temp }}/application-build/desktop/RESULT.json
            ${{ runner.temp }}/application-build/desktop/*.log
            ${{ runner.temp }}/application-build/draft/DSH SEP.app/Contents/Resources/PROGRAM.json
            ${{ runner.temp }}/application-build/draft/DSH SEP.app/Contents/Resources/BOOTSTRAP.json
            ${{ runner.temp }}/application-lifecycle/RESULT.json
            ${{ runner.temp }}/application-lifecycle/*.log
            ${{ runner.temp }}/application-native-preflight/RESULT.json
            ${{ runner.temp }}/application-native-preflight/INPUTS.json
            ${{ runner.temp }}/application-native-preflight/WORKER-RESULT.json
            ${{ runner.temp }}/application-native-preflight/CASE-*.json
            ${{ runner.temp }}/application-native-preflight/*.log
      - name: Keep the exact assembled candidate separate from lifecycle conclusions
        if: always() && steps.assembly.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-integrated-application-candidate
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/application-build/DSH-SEP-macOS-Alpha2-application-preview.zip
  