name: SEP Alpha.2 macOS installer contracts and native UI RED
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-installer-list:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Existing 22 native controller definitions and five boundaries
        run: |
          node --test --test-reporter=tap tools/alpha2-macos/installer-entry/boundaries.test.mjs > "$RUNNER_TEMP/installer-boundaries.tap"
          node tools/alpha2-macos/installer-entry/run-native.mjs "$RUNNER_TEMP/installer-controller" > "$RUNNER_TEMP/installer-controller.log" 2>&1
      - name: Four fixed recovery list GREEN definitions
        run: node tools/alpha2-macos/installer-entry/run-list-native.mjs "$RUNNER_TEMP/installer-list" > "$RUNNER_TEMP/installer-list.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-installer-list-r55
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-boundaries.tap
            ${{ runner.temp }}/installer-controller.log
            ${{ runner.temp }}/installer-list.log
            ${{ runner.temp }}/installer-controller/*.json
            ${{ runner.temp }}/installer-controller/*.tap
            ${{ runner.temp }}/installer-controller/*.log
            ${{ runner.temp }}/installer-list/*.json
            ${{ runner.temp }}/installer-list/*.tap
            ${{ runner.temp }}/installer-list/*.log
  installer-protocol-session-manifest:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Seventeen protocol twelve session eleven manifest contracts
        run: node --test --test-reporter=tap tools/alpha2-macos/installer-ui/protocol.test.mjs tools/alpha2-macos/installer-ui/controller-session.test.mjs tools/alpha2-macos/installer-ui/controller-session-sequential.test.mjs tools/alpha2-macos/installer-ui/manifest.test.mjs > "$RUNNER_TEMP/installer-contracts.tap" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-contracts-r55
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-contracts.tap
  installer-config-red:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Ten signed fixture config RED definitions
        run: node tools/alpha2-macos/installer-ui/run-config-native.mjs "$RUNNER_TEMP/installer-config" > "$RUNNER_TEMP/installer-config.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-config-red-r55
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-config.log
            ${{ runner.temp }}/installer-config/*.json
            ${{ runner.temp }}/installer-config/*.tap
  native-installer-appkit-red:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile actual AppKit RED contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installer-appkit-red"
          shasum -a 256 tools/alpha2-macos/installer-ui/native/InstallerUI.h tools/alpha2-macos/installer-ui/native/InstallerUI.m tools/alpha2-macos/installer-ui/native/InstallerUITests.m > "$RUNNER_TEMP/installer-appkit-red/INPUTS.sha256"
          clang -fobjc-arc -fblocks -Wall -Wextra -framework Cocoa tools/alpha2-macos/installer-ui/native/InstallerUI.m tools/alpha2-macos/installer-ui/native/InstallerUITests.m -o "$RUNNER_TEMP/installer-appkit-red/tests" > "$RUNNER_TEMP/installer-appkit-red/compile.log" 2>&1
      - name: Execute expected RED without installing or launching a payload
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/installer-appkit-red/tests" > "$RUNNER_TEMP/installer-appkit-red/RESULT.json" 2> "$RUNNER_TEMP/installer-appkit-red/stderr.log"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/installer-appkit-red/exit.txt"
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-installer-appkit-red
          if-no-files-found: error
          path: ${{ runner.temp }}/installer-appkit-red/*
