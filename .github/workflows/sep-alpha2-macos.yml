name: SEP Alpha.2 macOS native foundation
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-bootstrap-production-admission:
    runs-on: macos-15
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Native non-test binary admission, identity placeholders never executed
        run: node tools/alpha2-macos/bootstrap/run-production-native.mjs "$RUNNER_TEMP/bootstrap-production-native"
      - name: Preserve original outcomes including planned missing-feature RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-bootstrap-production-admission
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bootstrap-production-native/RESULT.json
            ${{ runner.temp }}/bootstrap-production-native/*.log
            ${{ runner.temp }}/bootstrap-production-native/cases/**/*.log
  