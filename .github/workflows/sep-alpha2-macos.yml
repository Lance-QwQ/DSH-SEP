name: SEP Alpha.2 macOS successor installer and installed lifecycle
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-installer-integration-r79:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Record actual native environment
        run: |
          set -euo pipefail
          { sw_vers; uname -a; node --version; } > "$RUNNER_TEMP/installer-integration-r79-system.txt"
      - name: Restore one fixed signed installer archive
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/package/restore-installer-application-r78.mjs "$RUNNER_TEMP/fixed-installer-r79"
      - name: Original lifecycle then real-button installation then installed first boot
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/fixed-installer-r79/RESULT.json"
          digest="$(shasum -a 256 "$result" | awk '{print $1}')"
          node tools/alpha2-macos/installer-ui/integration-r79/run-full.mjs "$result" "$digest" "$RUNNER_TEMP/installer-integration-r79"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-integration-native-r79
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-integration-r79-system.txt
            ${{ runner.temp }}/fixed-installer-r79/RESULT.json
            ${{ runner.temp }}/fixed-installer-r79/SOURCE-ASSEMBLY.json
            ${{ runner.temp }}/fixed-installer-r79/PACKAGE-INVENTORY.json
            ${{ runner.temp }}/fixed-installer-r79/*.log
            ${{ runner.temp }}/installer-integration-r79/*.json
            ${{ runner.temp }}/installer-integration-r79/*.jsonl
            ${{ runner.temp }}/installer-integration-r79/*.log
            ${{ runner.temp }}/installer-integration-r79/installed-receipt/*.json
            ${{ runner.temp }}/installer-integration-r79/installed-startup/*.json
            ${{ runner.temp }}/installer-integration-r79/installed-startup/*.jsonl
            ${{ runner.temp }}/installer-integration-r79/installed-startup/*.log
