name: SEP macOS current-source native revalidation and application
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-current-application:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Record actual native environment
        run: |
          set -euo pipefail
          { sw_vers; uname -a; node --version; } > "$RUNNER_TEMP/native-system.txt"
      - name: Restore exact historical application as dependency carrier
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/package/restore-fixed-application-r44.mjs "$RUNNER_TEMP/fixed-r44"
      - name: Prepare verified native dependencies
        run: |
          set -euo pipefail
          node tools/alpha2-macos/native-revalidation/application-environment.mjs "$RUNNER_TEMP/fixed-r44" "$RUNNER_TEMP/native-environment"
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const e=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/native-environment/ENV.json','utf8'));
          const keys=['SEP_OFFICIAL_HARNESS','SEP_MAC_BUNDLE_ROOT'];
          for(const key of keys){if(typeof e[key]!=='string'||/[\r\n]/.test(e[key]))throw Error('ENV_PATH_INVALID');appendFileSync(process.env.GITHUB_ENV,key+'='+e[key]+'\n');}
          NODE
      - name: Native source regression gate
        run: |
          set -euo pipefail
          temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          node tools/alpha2-macos/native-revalidation/run-native.mjs "$temp/native-regression"
      - name: Real Loader pending recovery and document visual gate
        run: node tools/alpha2-macos/native-revalidation/application-verify.mjs fixed "$RUNNER_TEMP/fixed-r44" "$GITHUB_WORKSPACE/tools/alpha2-macos" "$RUNNER_TEMP/native-business"
      - name: Install fixed build tool
        run: node tools/alpha2-macos/desktop/managed-overlay/install-asar-tool.mjs "$RUNNER_TEMP/asar-tool"
      - name: Build and independently restore current application
        run: node tools/alpha2-macos/native-revalidation/application-build.mjs "$RUNNER_TEMP/fixed-r44" "$GITHUB_WORKSPACE/tools/alpha2-macos" "$RUNNER_TEMP/asar-tool/node_modules/@electron/asar/lib/asar.js" "$RUNNER_TEMP/current-app" "$RUNNER_TEMP/native-business"
      - name: Revalidate actual built application runtime and native dependencies
        run: node tools/alpha2-macos/native-revalidation/application-verify.mjs built "$RUNNER_TEMP/current-app" "$GITHUB_WORKSPACE/tools/alpha2-macos" "$RUNNER_TEMP/native-built"
      - name: Split exact application archive for bounded transfer
        run: node tools/alpha2-macos/package/split-application-artifact.mjs "$RUNNER_TEMP/current-app" "$RUNNER_TEMP/current-app-transport"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-current-application-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/native-system.txt
            ${{ runner.temp }}/fixed-r44/RESULT.json
            ${{ runner.temp }}/fixed-r44/PACKAGE-INVENTORY.json
            ${{ runner.temp }}/asar-tool/*.json
            ${{ runner.temp }}/asar-tool/*.log
            ${{ runner.temp }}/fixed-r44/*.log
            ${{ runner.temp }}/native-environment/*.json
            ${{ runner.temp }}/native-regression/*.json
            ${{ runner.temp }}/native-regression/*.log
            ${{ runner.temp }}/native-regression/workflow/CLEANUP.jsonl
            ${{ runner.temp }}/native-business/*.json
            ${{ runner.temp }}/native-business/*.log
            ${{ runner.temp }}/native-business/*/native.tap
            ${{ runner.temp }}/native-business/*/receipts/*.json
            ${{ runner.temp }}/native-built/*.json
            ${{ runner.temp }}/native-built/*.log
            ${{ runner.temp }}/native-built/*/native.tap
            ${{ runner.temp }}/native-built/*/receipts/*.json
            ${{ runner.temp }}/current-app-REVALIDATION.json
            ${{ runner.temp }}/current-app-build.log
            ${{ runner.temp }}/current-app/*.json
            ${{ runner.temp }}/current-app/*.log
            ${{ runner.temp }}/current-app/desktop/*.json
            ${{ runner.temp }}/current-app/desktop/*.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-current-application-part-one
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/current-app-transport/*.0001.part
            ${{ runner.temp }}/current-app-transport/transport-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-current-application-part-two
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/current-app-transport/*.0002.part
            ${{ runner.temp }}/current-app-transport/transport-manifest.json
