name: SEP Alpha.2 macOS fixed application diagnostics
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-fixed-lifecycle:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Restore unchanged r44 app and verify complete inventory and signature
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/package/restore-fixed-application-r44.mjs "$RUNNER_TEMP/application-build"
      - name: Actual system entry with raw observer outcomes and unchanged identity guard
        run: node tools/alpha2-macos/package/exercise-application.mjs "$RUNNER_TEMP/application-build" "$RUNNER_TEMP/application-lifecycle"
      - name: Preserve unchanged product binding and original diagnostic outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-fixed-application-lifecycle
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/application-build/RESULT.json
            ${{ runner.temp }}/application-build/*.log
            ${{ runner.temp }}/application-workspace-contracts.tap
            ${{ runner.temp }}/application-workspace-diagnostic/*.json
            ${{ runner.temp }}/application-workspace-diagnostic/*.log
            ${{ runner.temp }}/application-lifecycle/RESULT.json
            ${{ runner.temp }}/application-lifecycle/*.log
            ${{ runner.temp }}/application-lifecycle/*.jsonl
  native-fixed-workspace:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Restore unchanged r44 app and verify complete inventory and signature
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/package/restore-fixed-application-r44.mjs "$RUNNER_TEMP/application-build"
      - name: One independent Inspector-assisted welcome to workspace and badge round
        run: |
          node --test --test-reporter=tap tools/alpha2-macos/desktop/workspace-diagnostic.test.mjs > "$RUNNER_TEMP/application-workspace-contracts.tap"
          receipt="$RUNNER_TEMP/application-build/RESULT.json"
          expected_sha=$(shasum -a 256 "$receipt" | cut -d ' ' -f 1)
          node tools/alpha2-macos/desktop/workspace-diagnostic.mjs "$receipt" "$expected_sha" "$RUNNER_TEMP/application-workspace-diagnostic"
      - name: Preserve unchanged product binding and original diagnostic outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-fixed-application-workspace
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/application-build/RESULT.json
            ${{ runner.temp }}/application-build/*.log
            ${{ runner.temp }}/application-workspace-contracts.tap
            ${{ runner.temp }}/application-workspace-diagnostic/*.json
            ${{ runner.temp }}/application-workspace-diagnostic/*.log
            ${{ runner.temp }}/application-lifecycle/RESULT.json
            ${{ runner.temp }}/application-lifecycle/*.log
            ${{ runner.temp }}/application-lifecycle/*.jsonl
