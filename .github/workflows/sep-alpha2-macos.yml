name: SEP Alpha.2 macOS installed application opener contracts
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-installer-opener-red:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Run seven fixed native LaunchServices opener RED definitions
        shell: bash
        run: |
          set -euo pipefail
          node tools/alpha2-macos/installer-ui/application/opener-native.mjs "$RUNNER_TEMP/installer-opener-red"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-installer-opener-red
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-opener-red/*.json
            ${{ runner.temp }}/installer-opener-red/*.stdout
            ${{ runner.temp }}/installer-opener-red/*.stderr
