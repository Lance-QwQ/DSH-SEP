name: SEP Alpha.2 macOS native foundation
on:
  push:
    branches: ['codex/sep-alpha2-macos-20261014']
    paths: ['tools/alpha2-macos/**', '.github/workflows/sep-alpha2-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-foundation:
    if: false
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Portable identity contracts
        run: node --test --test-reporter=tap tools/alpha2-macos/identity-contract.test.mjs
      - name: Failed synthetic command retains diagnostic
        run: |
          export SEP_MACOS_DIAGNOSTIC_TEST_ROOT="$(cd "$RUNNER_TEMP" && pwd -P)/sep-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node --test --test-reporter=tap tools/alpha2-macos/command-log.test.mjs
      - name: Three native APFS and owner rounds
        run: |
          root="$(cd "$RUNNER_TEMP" && pwd -P)/sep-alpha2-macos-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'SEP_MACOS_OUTPUT=%s\n' "$root" >> "$GITHUB_ENV"
          node tools/alpha2-macos/run-native.mjs "$root"
      - name: Preserve synthetic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-alpha2-macos-native-foundation
          path: |
            ${{ env.SEP_MACOS_OUTPUT }}/RESULT.json
            ${{ env.SEP_MACOS_OUTPUT }}/round-*/RESULT.json
            ${{ env.SEP_MACOS_OUTPUT }}/round-*/worker.*.log
          if-no-files-found: error
          retention-days: 14
  budget-native:
    if: false
    needs: native-foundation
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Exact synthetic accounting dependency
        run: npm ci --prefix tools/alpha2-macos --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-sep-macos"
      - name: Three native accounting rounds
        run: |
          root="$(cd "$RUNNER_TEMP" && pwd -P)/sep-macos-budget-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'SEP_MACOS_BUDGET_OUTPUT=%s\n' "$root" >> "$GITHUB_ENV"
          node tools/alpha2-macos/run-budget-native.mjs "$root"
      - name: Preserve budget receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-alpha2-macos-native-budget
          path: ${{ env.SEP_MACOS_BUDGET_OUTPUT }}/RESULT.json
          if-no-files-found: error
          retention-days: 14
  sandbox-feasibility:
    if: false
    needs: native-foundation
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Actual App Sandbox control and three signed rounds
        run: |
          root="$(cd "$RUNNER_TEMP" && pwd -P)/sep-macos-sandbox-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'SEP_MACOS_SANDBOX_OUTPUT=%s\n' "$root" >> "$GITHUB_ENV"
          node tools/alpha2-macos/run-sandbox-prototype.mjs "$root"
      - name: Preserve sandbox receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-alpha2-macos-sandbox-feasibility
          path: |
            ${{ env.SEP_MACOS_SANDBOX_OUTPUT }}/RESULT.json
            ${{ env.SEP_MACOS_SANDBOX_OUTPUT }}/round-*.json
            ${{ env.SEP_MACOS_SANDBOX_OUTPUT }}/control.json
            ${{ env.SEP_MACOS_SANDBOX_OUTPUT }}/*.log
          if-no-files-found: error
          retention-days: 14

  # Merge this job into the already-authorized macOS test workflow; not a Release.
  desktop-carrier:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-carrier]')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Prepare fixed official source in ephemeral storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          SRC="$RUNNER_TEMP/sep-alpha2-official-source"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$SRC" fetch --depth 1 origin d743267388641bc76f17c45ce8b4c231aed1d32c
          git -C "$SRC" checkout --detach FETCH_HEAD
          echo "SEP_MAC_OFFICIAL_SOURCE=$SRC" >> "$GITHUB_ENV"
      - name: Native Alpha.2 carrier build
        run: node tools/alpha2-macos/desktop/build-carrier.mjs "$SEP_MAC_OFFICIAL_SOURCE" "$RUNNER_TEMP/sep-alpha2-desktop-build"
      - name: Three actual native carrier rounds
        run: node tools/alpha2-macos/desktop/smoke-carrier.mjs "$SEP_MAC_OFFICIAL_SOURCE/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/mac-arm64/DSH SEP.app" "$RUNNER_TEMP/sep-alpha2-desktop-smoke"
      - name: Preserve actual carrier and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-alpha2-macos-desktop-carrier
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sep-alpha2-desktop-build/*.json
            ${{ runner.temp }}/sep-alpha2-desktop-build/*.log
            ${{ runner.temp }}/sep-alpha2-desktop-build/desktop-carrier.zip
            ${{ runner.temp }}/sep-alpha2-desktop-smoke/

  per-task-isolation-prototype:
    if: false
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Bounded escaped-child boundary prototype
        run: node tools/alpha2-macos/isolation/seatbelt-prototype.mjs "$(cd "$RUNNER_TEMP" && pwd -P)/sep-task-isolation"
      - name: Preserve prototype evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-per-task-isolation-prototype
          path: |
            ${{ runner.temp }}/sep-task-isolation/*.json
            ${{ runner.temp }}/sep-task-isolation/*.log
            ${{ runner.temp }}/sep-task-isolation/*.sb
            ${{ runner.temp }}/sep-task-isolation/*.ips
            ${{ runner.temp }}/sep-task-isolation/*.crash
            ${{ runner.temp }}/sep-task-isolation/work-*/*.receipt
          if-no-files-found: error
          retention-days: 14

  apfs-controlled-files:
    if: false
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Three native APFS helper and adapter rounds
        run: node tools/alpha2-macos/apfs-tree/run-tests.mjs "$(cd "$RUNNER_TEMP" && pwd -P)/sep-apfs-files"
      - name: Preserve native receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-apfs-controlled-files
          path: |
            ${{ runner.temp }}/sep-apfs-files/*.json
            ${{ runner.temp }}/sep-apfs-files/*.log
          if-no-files-found: error
          retention-days: 14

  trusted-file-transactions:
    if: false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Compile actual APFS helper
        run: |
          root="$(cd "$RUNNER_TEMP" && pwd -P)/sep-file-transactions"
          mkdir "$root"
          echo "SEP_MAC_TX_OUTPUT=$root" >> "$GITHUB_ENV"
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -arch arm64 tools/alpha2-macos/apfs-tree/native-tree.c -o "$root/native-tree"
          shasum -a 256 "$root/native-tree" > "$root/native-tree.sha256"
      - name: Replay exact source derivations
        run: node --test --test-reporter=tap tools/alpha2-macos/transactions/origin.test.mjs > "$SEP_MAC_TX_OUTPUT/origin-replay.log" 2>&1
      - name: Three native SQLite and APFS transaction rounds
        run: |
          set +e
          set -o pipefail
          failed=0
          for round in 1 2 3; do
            SEP_MAC_TREE_HELPER="$SEP_MAC_TX_OUTPUT/native-tree" SEP_MAC_TRANSACTION_TEST_ROOT="$SEP_MAC_TX_OUTPUT/round-$round" node --test --test-reporter=tap tools/alpha2-macos/transactions/transactions.test.mjs > "$SEP_MAC_TX_OUTPUT/round-$round.log" 2>&1
            rc=$?
            cat "$SEP_MAC_TX_OUTPUT/round-$round.log"
            printf '%s %s\n' "$round" "$rc" >> "$SEP_MAC_TX_OUTPUT/EXIT-CODES.txt"
            if [ "$rc" != 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Preserve native transaction logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-trusted-file-transactions
          path: |
            ${{ env.SEP_MAC_TX_OUTPUT }}/*.log
            ${{ env.SEP_MAC_TX_OUTPUT }}/*.txt
            ${{ env.SEP_MAC_TX_OUTPUT }}/*.sha256
          if-no-files-found: error
          retention-days: 14

  # Bind the immutable original artifact archive before extracting any executable.
  # This job reuses the first native build; it does not repeat compilation or publish a Release.
  # Bind the immutable original artifact archive before extracting any executable.
  # This job reuses the first native build; it does not repeat compilation or publish a Release.
  desktop-carrier-smoke-existing:
    if: false
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SEP_CARRIER_ARCHIVE_SHA256: 63cc8bd74c5750911b668ce5a41aa15239db1a59911204355ec334d4fa4bc0b8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Fetch and verify immutable carrier archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Lance-QwQ/DSH-SEP/actions/artifacts/11871124360/zip > "$RUNNER_TEMP/sep-carrier-archive.zip"
          test "$(shasum -a 256 "$RUNNER_TEMP/sep-carrier-archive.zip" | cut -d ' ' -f 1)" = "$SEP_CARRIER_ARCHIVE_SHA256"
          mkdir "$RUNNER_TEMP/sep-carrier-input"
          ditto -x -k "$RUNNER_TEMP/sep-carrier-archive.zip" "$RUNNER_TEMP/sep-carrier-input"
          mkdir "$RUNNER_TEMP/sep-carrier-build-receipts"
          cp "$RUNNER_TEMP/sep-carrier-input/BUILD-RESULT.json" "$RUNNER_TEMP/sep-carrier-input/ORIGIN.json" "$RUNNER_TEMP/sep-carrier-build-receipts/"
      - name: Verify exact inner ZIP before extraction
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          INPUT="$RUNNER_TEMP/sep-carrier-input"
          ACTUAL=$(shasum -a 256 "$INPUT/desktop-carrier.zip" | cut -d ' ' -f 1)
          # The original r1 manifest predates its inner-digest field. The exact
          # reviewed outer SHA above authenticates both this ZIP and its report.
          node -e 'const r=require(process.argv[1]);if(r.status!=="pass"||r.artifact!=="desktop-carrier.zip"||r.officialCommit!=="d743267388641bc76f17c45ce8b4c231aed1d32c"||r.fullSepCertification!=="not_run") process.exit(1)' "$INPUT/BUILD-RESULT.json"
          printf '%s\n' "$ACTUAL" > "$RUNNER_TEMP/sep-carrier-build-receipts/inner-zip.sha256"
          mkdir "$RUNNER_TEMP/sep-carrier-extracted"
          ditto -x -k "$INPUT/desktop-carrier.zip" "$RUNNER_TEMP/sep-carrier-extracted"
      - name: Actual three-round native carrier smoke
        run: |
          node --test --test-reporter=tap tools/alpha2-macos/desktop/inspector-entry.test.mjs > "$RUNNER_TEMP/sep-carrier-build-receipts/inspector-tests.tap"
          node tools/alpha2-macos/desktop/smoke-carrier.mjs "$RUNNER_TEMP/sep-carrier-extracted/DSH SEP.app" "$RUNNER_TEMP/sep-alpha2-desktop-smoke"
      - name: Preserve each planned round and cleanup attribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-alpha2-macos-desktop-smoke-existing
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sep-alpha2-desktop-smoke/
            ${{ runner.temp }}/sep-carrier-build-receipts/

  desktop-managed-overlay:
    if: false
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      SEP_MAC_OVERLAY_CAPTURE_SHA256: c7a1d78b577648ceaa6e94006e8d910cfaff579c1a23bdec240921c2d4f2c597
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify public derived capture and admission rules
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          export SEP_MAC_MANAGED_CAPTURE="$GITHUB_WORKSPACE/tools/alpha2-macos/desktop/managed-capture"
          mkdir "$RUNNER_TEMP/overlay-receipts"
          node --test --test-reporter=tap tools/alpha2-macos/desktop/inspector-entry.test.mjs tools/alpha2-macos/desktop/managed-overlay/entry.test.mjs tools/alpha2-macos/desktop/managed-overlay/paths.test.mjs tools/alpha2-macos/desktop/managed-overlay/captured.test.mjs tools/alpha2-macos/desktop/managed-overlay/asar-plist.test.mjs tools/alpha2-macos/desktop/managed-overlay/desktop-dependencies.test.mjs tools/alpha2-macos/desktop/managed-overlay/desktop-imports.test.mjs > "$RUNNER_TEMP/overlay-receipts/tests.tap"
          cp -R "$SEP_MAC_MANAGED_CAPTURE" "$RUNNER_TEMP/managed-capture"
      - name: Fetch fixed successful carrier artifact and derive inner digest
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/desktop/managed-overlay/download-carrier.mjs "$RUNNER_TEMP/managed-carrier-download"
      - name: Extract bound carrier and install integrity-pinned ASAR tool
        run: |
          mkdir "$RUNNER_TEMP/managed-carrier"
          ditto -x -k "$RUNNER_TEMP/managed-carrier-download/input/desktop-carrier.zip" "$RUNNER_TEMP/managed-carrier"
          node tools/alpha2-macos/desktop/managed-overlay/install-asar-tool.mjs "$RUNNER_TEMP/asar-tools"
      - name: Assemble isolated managed overlay and verify native signature
        id: managed_overlay_build
        run: node tools/alpha2-macos/desktop/managed-overlay/apply-to-carrier.mjs "$RUNNER_TEMP/managed-carrier/DSH SEP.app" "$RUNNER_TEMP/managed-capture" "$RUNNER_TEMP/managed-overlay-result" "$RUNNER_TEMP/asar-tools/node_modules/@electron/asar/lib/asar.js"
      - name: Actual missing-connection refusal without ordinary Host startup
        run: node tools/alpha2-macos/desktop/managed-overlay/probe-missing-connection.mjs "$RUNNER_TEMP/managed-overlay-result/DSH SEP.app" "$RUNNER_TEMP/managed-negative"
      - name: Verify current broker and real Inspector helpers
        id: full_broker
        if: always() && steps.managed_overlay_build.outcome == 'success'
        run: |
          export SEP_TEST_ROOT="$RUNNER_TEMP"
          export SEP_STARTUP_HOST_TEST_ROOT="$RUNNER_TEMP/startup-host-tests"
          export SEP_STARTUP_HOST_ENTRY="$GITHUB_WORKSPACE/tools/alpha2-macos/desktop/managed-broker/business-host.mjs"
          export SEP_STARTUP_HOST_EXPECTED_SHA="a1712ce685020656e3994a4af9ea4e2f59eb0d7546032a9b58643e8d482345e5"
          export SEP_DESKTOP_TEST_ROOT="$RUNNER_TEMP/broker-integration-tests"
          mkdir "$SEP_DESKTOP_TEST_ROOT"
          node --test --test-reporter=tap tools/alpha2-macos/desktop/managed-broker/*.test.mjs tools/alpha2-macos/desktop/managed-overlay/refusal-observer.test.mjs tools/alpha2-macos/desktop/smoke-helpers.test.mjs tools/alpha2-macos/desktop/inspector-live.test.mjs tools/alpha2-macos/startup-host-recovery/recovery.test.mjs > "$RUNNER_TEMP/overlay-receipts/broker-integration.tap"
      - name: Assemble actual Mac document/image/settings package from verified program inputs
        id: full_build
        if: always() && steps.full_broker.outcome == 'success'
        env:
          SEP_MAC_BUSINESS_CAPTURE_SHA256: 3c6eaccc6337907e0ece2715d6b61213ef8d382dc98f2fa703b4c42af07613b3
        run: |
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -arch arm64 tools/alpha2-macos/apfs-tree/native-tree.c -o "$RUNNER_TEMP/full-project-tree"
          export SEP_MAC_IMAGE_PACKAGE=1
          export SEP_MAC_ATTACHMENT_HELPER="$RUNNER_TEMP/full-attachment-tree"
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -arch arm64 tools/alpha2-macos/media/native-attachments.c -o "$SEP_MAC_ATTACHMENT_HELPER"
          export SEP_MAC_DOCUMENT_PACKAGE=1
          export SEP_MAC_PARSER_OWNER="$RUNNER_TEMP/full-parser-owner"
          export SEP_MAC_PARSER_DEPENDENCIES="$RUNNER_TEMP/full-parser-dependencies/node_modules"
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -arch arm64 tools/alpha2-macos/task-sandbox/task-owner.c -o "$SEP_MAC_PARSER_OWNER"
          node tools/alpha2-macos/package/install-parser-dependencies.mjs "$RUNNER_TEMP/full-parser-dependencies"
          node tools/alpha2-macos/package/assemble-full.mjs "$RUNNER_TEMP/managed-overlay-result" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/alpha2-macos" "$RUNNER_TEMP/full-project-tree" "$RUNNER_TEMP/asar-tools/node_modules/@electron/asar/lib/asar.js" "$RUNNER_TEMP/final-package"
      - name: Restore the actual distribution archive into a fresh directory
        id: full_restore
        if: always() && steps.full_build.outcome == 'success'
        run: |
          mkdir "$RUNNER_TEMP/restored-package"
          ditto -x -k "$RUNNER_TEMP/final-package/DSH-SEP-macOS-Alpha2-preview.zip" "$RUNNER_TEMP/restored-package"
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {verifyPackage} from './tools/alpha2-macos/package/package-inventory.mjs';
          const out=join(process.env.RUNNER_TEMP,'final-package'),receipt=JSON.parse(await readFile(join(out,'PACKAGE-INVENTORY.json'),'utf8'));
          const result=await verifyPackage(join(process.env.RUNNER_TEMP,'restored-package/DSH-SEP-macOS-Alpha2-preview'),receipt);
          await writeFile(join(out,'ARCHIVE-RESTORE.json'),JSON.stringify(result,null,2)+'\n',{flag:'wx'});
          JS
      - name: Three real installed Profile and desktop cycles
        id: full_smoke
        if: always() && steps.full_restore.outcome == 'success'
        run: |
          programSha=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).programSha256)' "$RUNNER_TEMP/final-package/RESULT.json")
          node tools/alpha2-macos/desktop/smoke-full.mjs "$RUNNER_TEMP/restored-package/DSH-SEP-macOS-Alpha2-preview/PROGRAM.json" "$programSha" "$RUNNER_TEMP/full-native-smoke"
      - name: Confirm installed program unchanged after real use
        id: full_inventory
        if: always() && steps.full_smoke.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {verifyPackage} from './tools/alpha2-macos/package/package-inventory.mjs';
          const root=join(process.env.RUNNER_TEMP,'final-package');
          const receipt=JSON.parse(await readFile(join(root,'PACKAGE-INVENTORY.json'),'utf8'));
          const result=await verifyPackage(join(process.env.RUNNER_TEMP,'restored-package/DSH-SEP-macOS-Alpha2-preview'),receipt);
          await writeFile(join(root,'POST-SMOKE.json'),JSON.stringify(result,null,2)+'\n',{flag:'wx'});
          JS
      - name: Preserve complete candidate only after installed smoke succeeds
        if: always() && steps.full_inventory.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-document-preview-package
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/final-package/DSH-SEP-macOS-Alpha2-preview.zip
            ${{ runner.temp }}/final-package/RESULT.json
            ${{ runner.temp }}/final-package/PACKAGE-INVENTORY.json
            ${{ runner.temp }}/final-package/POST-SMOKE.json
            ${{ runner.temp }}/final-package/ARCHIVE-RESTORE.json
      - name: Preserve package and installed-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-installed-package-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/final-package/RESULT.json
            ${{ runner.temp }}/final-package/ARCHIVE-RESTORE.json
            ${{ runner.temp }}/final-package/*.log
            ${{ runner.temp }}/final-package/DSH-SEP-macOS-Alpha2-preview/payload/parser-runtime/manifest.json
            ${{ runner.temp }}/full-parser-dependencies/RESULT.json
            ${{ runner.temp }}/full-parser-dependencies/*.log
            ${{ runner.temp }}/full-native-smoke/RESULT.json
            ${{ runner.temp }}/full-native-smoke/round-*/*.json
