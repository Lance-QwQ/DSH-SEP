name: SEP Alpha.2 macOS native installer controller
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-installer-entry:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Record exact native environment
        run: |
          sw_vers > "$RUNNER_TEMP/installer-entry-environment.txt"
          uname -a >> "$RUNNER_TEMP/installer-entry-environment.txt"
      - name: Queue quarantine and UTF-8 contracts (five)
        run: node --test --test-reporter=tap tools/alpha2-macos/installer-entry/boundaries.test.mjs > "$RUNNER_TEMP/installer-boundaries.tap"
      - name: Run native installer account and controller contract
        run: node tools/alpha2-macos/installer-entry/run-native.mjs "$RUNNER_TEMP/installer-entry" > "$RUNNER_TEMP/installer-entry-runner.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sep-macos-installer-entry-r53
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-boundaries.tap
            ${{ runner.temp }}/installer-entry-environment.txt
            ${{ runner.temp }}/installer-entry-runner.log
            ${{ runner.temp }}/installer-entry/*.json
            ${{ runner.temp }}/installer-entry/*.tap
            ${{ runner.temp }}/installer-entry/*.log

  native-recovery-list-red:
    needs: native-installer-entry
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Four separate recovery-list RED definitions
        run: node tools/alpha2-macos/installer-entry/run-list-native.mjs "$RUNNER_TEMP/recovery-list" > "$RUNNER_TEMP/recovery-list-runner.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sep-macos-recovery-list-red-r53
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovery-list-runner.log
            ${{ runner.temp }}/recovery-list/*.json
            ${{ runner.temp }}/recovery-list/*.tap
            ${{ runner.temp }}/recovery-list/*.log
