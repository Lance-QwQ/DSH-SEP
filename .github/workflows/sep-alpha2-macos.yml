name: SEP Alpha.2 macOS fixed installer configuration
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  installer-config-green:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Ten unchanged signed fixture configuration definitions
        run: node tools/alpha2-macos/installer-ui/run-config-native.mjs "$RUNNER_TEMP/installer-config" > "$RUNNER_TEMP/installer-config.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-config-r56
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-config.log
            ${{ runner.temp }}/installer-config/*.json
            ${{ runner.temp }}/installer-config/*.tap
  installer-admission-red:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Twenty-nine native fixed NSBundle admission RED definitions
        run: node tools/alpha2-macos/installer-ui/admission/run-native.mjs "$RUNNER_TEMP/installer-admission" > "$RUNNER_TEMP/installer-admission.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-admission-red-r56
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-admission.log
            ${{ runner.temp }}/installer-admission/*.json
            ${{ runner.temp }}/installer-admission/*.tap
            ${{ runner.temp }}/installer-admission/*.log
