name: SEP Alpha.2 macOS pending-plan startup admission
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  native-pending-startup:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Restore immutable r61 native dependency carrier
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          node tools/alpha2-macos/desktop/project-workflow-product/restore-project-application-r61.mjs "$RUNNER_TEMP/pending-r61"
      - name: Real Mac factory, P2, parser and pending review admission
        run: |
          node tools/alpha2-macos/desktop/project-workflow-product/pending-startup/run-native.mjs "$RUNNER_TEMP/pending-r61" "$RUNNER_TEMP/pending-native"
      - name: Preserve exact inputs, original failures and close receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep-macos-pending-startup-r73
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pending-native/RESULT.json
            ${{ runner.temp }}/pending-native/INPUTS.json
            ${{ runner.temp }}/pending-native/parser-fixture.json
            ${{ runner.temp }}/pending-native/native.tap
            ${{ runner.temp }}/pending-native/native.stderr
            ${{ runner.temp }}/pending-native/receipts/*.json
            ${{ runner.temp }}/pending-r61/RESULT.json
            ${{ runner.temp }}/pending-r61/*.log
            ${{ runner.temp }}/pending-r61/evidence/project-build/RESULT.json
