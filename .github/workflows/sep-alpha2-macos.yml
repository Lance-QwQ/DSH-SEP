name: SEP Alpha.2 macOS current project observable readiness
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  project-native-ui-readiness:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Restore the exact r61 application with signatures and inventory
        env:
          SEP_ARTIFACT_TOKEN: ${{ github.token }}
        run: node tools/alpha2-macos/desktop/project-workflow-product/restore-project-application-r61.mjs "$RUNNER_TEMP/project-r61"
      - name: Bind this verified restore receipt
        run: |
          set -euo pipefail
          echo "SEP_PROJECT_UI_SOURCE=$GITHUB_WORKSPACE/tools/alpha2-macos" >> "$GITHUB_ENV"
          echo "SEP_PROJECT_UI_ASSEMBLY_RESULT=$RUNNER_TEMP/project-r61/RESULT.json" >> "$GITHUB_ENV"
          echo "SEP_PROJECT_UI_ASSEMBLY_SHA256=$(shasum -a 256 "$RUNNER_TEMP/project-r61/RESULT.json" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "SEP_PROJECT_UI_OPERATOR_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Current project two-round UI with observable readiness
        shell: bash
        run: |
          set -euo pipefail
          : "${SEP_PROJECT_UI_SOURCE:?absolute source root}"
          : "${SEP_PROJECT_UI_ASSEMBLY_RESULT:?verified restore RESULT}"
          : "${SEP_PROJECT_UI_ASSEMBLY_SHA256:?restore RESULT SHA}"
          : "${SEP_PROJECT_UI_OPERATOR_NODE:?verified Node}"
          output="$RUNNER_TEMP/project-ui-native-r3"
          mkdir "$output"
          /usr/bin/sw_vers > "$output/mac-version.txt"
          /usr/bin/clang -framework ApplicationServices "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/ax-capability.m" -o "$output/ax-capability"
          "$output/ax-capability" > "$output/AX-CAPABILITY.json"
          "$SEP_PROJECT_UI_OPERATOR_NODE" --test --test-reporter=tap "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-contract.test.mjs" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-authority-derive.test.mjs" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-readiness.test.mjs" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-readiness-derive.test.mjs" > "$output/contracts.tap" 2> "$output/contracts.stderr"
          "$SEP_PROJECT_UI_OPERATOR_NODE" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-operator-r3.mjs" "$SEP_PROJECT_UI_ASSEMBLY_RESULT" "$SEP_PROJECT_UI_ASSEMBLY_SHA256" "$output/round1" "$output/data" 1
          "$SEP_PROJECT_UI_OPERATOR_NODE" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-operator-r3.mjs" "$SEP_PROJECT_UI_ASSEMBLY_RESULT" "$SEP_PROJECT_UI_ASSEMBLY_SHA256" "$output/round2" "$output/data" 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: project-native-ui-readiness-r70
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/project-r61/RESULT.json
            ${{ runner.temp }}/project-r61/*.log
            ${{ runner.temp }}/project-r61/PACKAGE-INVENTORY.json
            ${{ runner.temp }}/project-r61/evidence/project-build/RESULT.json
            ${{ runner.temp }}/project-ui-native-r3/*.json
            ${{ runner.temp }}/project-ui-native-r3/*.tap
            ${{ runner.temp }}/project-ui-native-r3/*.stderr
            ${{ runner.temp }}/project-ui-native-r3/*.txt
            ${{ runner.temp }}/project-ui-native-r3/round1/*.json
            ${{ runner.temp }}/project-ui-native-r3/round1/*.log
            ${{ runner.temp }}/project-ui-native-r3/round2/*.json
            ${{ runner.temp }}/project-ui-native-r3/round2/*.log
