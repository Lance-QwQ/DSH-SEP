name: SEP Alpha.2 macOS fixed installer resource assembly
on:
  push:
    branches: [codex/sep-alpha2-macos-20261014]
permissions:
  contents: read
jobs:
  installer-resource-red:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Twelve signed fixture resource assembly RED definitions
        run: node tools/alpha2-macos/installer-ui/resources/run-native.mjs "$RUNNER_TEMP/installer-resources" > "$RUNNER_TEMP/installer-resources.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-resources-red-r60
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-resources.log
            ${{ runner.temp }}/installer-resources/*.json
            ${{ runner.temp }}/installer-resources/*.tap
            ${{ runner.temp }}/installer-resources/cases/**/RESOURCES-BUILD.json
            ${{ runner.temp }}/installer-resources/cases/**/*.log
