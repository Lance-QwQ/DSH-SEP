# Test-only r3; exact unchanged r61 package, separate fresh data root.
- name: Current project two-round UI with observable readiness
  shell: bash
  run: |
    set -euo pipefail
    : "${SEP_PROJECT_UI_SOURCE:?absolute source root}"
    : "${SEP_PROJECT_UI_ASSEMBLY_RESULT:?verified restore RESULT}"
    : "${SEP_PROJECT_UI_ASSEMBLY_SHA256:?restore RESULT SHA}"
    : "${SEP_PROJECT_UI_OPERATOR_NODE:?verified Node}"
    output="$RUNNER_TEMP/project-ui-native-r3"
    mkdir "$output"
    /usr/bin/sw_vers > "$output/mac-version.txt"
    /usr/bin/clang -framework ApplicationServices "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/ax-capability.m" -o "$output/ax-capability"
    "$output/ax-capability" > "$output/AX-CAPABILITY.json"
    "$SEP_PROJECT_UI_OPERATOR_NODE" --test --test-reporter=tap "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-contract.test.mjs" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-authority-derive.test.mjs" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-readiness.test.mjs" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-readiness-derive.test.mjs" > "$output/contracts.tap" 2> "$output/contracts.stderr"
    "$SEP_PROJECT_UI_OPERATOR_NODE" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-operator-r3.mjs" "$SEP_PROJECT_UI_ASSEMBLY_RESULT" "$SEP_PROJECT_UI_ASSEMBLY_SHA256" "$output/round1" "$output/data" 1
    "$SEP_PROJECT_UI_OPERATOR_NODE" "$SEP_PROJECT_UI_SOURCE/desktop/project-workflow-product/native-operator-r3.mjs" "$SEP_PROJECT_UI_ASSEMBLY_RESULT" "$SEP_PROJECT_UI_ASSEMBLY_SHA256" "$output/round2" "$output/data" 2
# Always archive output/*.json/*.tap/*.stderr/*.txt and round1/round2 *.json/*.log.
# Retain exact restore RESULT, inventory and logs as before. No rebuild/signing.
