task-sandbox-native-red:
  runs-on: macos-15
  timeout-minutes: 15
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24.19.0'
    - name: Build APFS helper and record implementation-before state
      run: |
        root="$(cd "$RUNNER_TEMP" && pwd -P)/sep-task-sandbox-red"
        mkdir "$root"
        echo "SEP_TASK_RED_OUTPUT=$root" >> "$GITHUB_ENV"
        xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -arch arm64 tools/alpha2-macos/apfs-tree/native-tree.c -o "$root/native-tree"
        shasum -a 256 tools/alpha2-macos/task-sandbox/* "$root/native-tree" > "$root/inputs.sha256"
        SEP_MAC_TREE_HELPER="$root/native-tree" node tools/alpha2-macos/task-sandbox/run-native-tests.mjs "$root/native"
    - name: Preserve native RED evidence without relabeling it pass
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sep-macos-task-sandbox-native-red
        if-no-files-found: error
        path: |
          ${{ env.SEP_TASK_RED_OUTPUT }}/inputs.sha256
          ${{ env.SEP_TASK_RED_OUTPUT }}/native/*.log
          ${{ env.SEP_TASK_RED_OUTPUT }}/native/*.json
