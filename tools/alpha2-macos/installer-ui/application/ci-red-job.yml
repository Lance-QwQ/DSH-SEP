native-installer-application-red:
  runs-on: macos-15
  timeout-minutes: 10
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Compile fixed UI plus missing application delegate
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/installer-application-red"
        shasum -a 256 tools/alpha2-macos/installer-ui/native/InstallerUI.h tools/alpha2-macos/installer-ui/native/InstallerUI.m tools/alpha2-macos/installer-ui/application/InstallerApplication.h tools/alpha2-macos/installer-ui/application/InstallerApplication.m tools/alpha2-macos/installer-ui/application/InstallerApplicationTests.m > "$RUNNER_TEMP/installer-application-red/INPUTS.sha256"
        clang -fobjc-arc -fblocks -Wall -Wextra -DSEP_INSTALLER_APPLICATION_TESTING=1 -framework Cocoa tools/alpha2-macos/installer-ui/native/InstallerUI.m tools/alpha2-macos/installer-ui/application/InstallerApplication.m tools/alpha2-macos/installer-ui/application/InstallerApplicationTests.m -o "$RUNNER_TEMP/installer-application-red/tests" > "$RUNNER_TEMP/installer-application-red/compile.log" 2>&1
    - name: Run eight native menu and termination RED contracts
      shell: bash
      run: |
        set +e
        "$RUNNER_TEMP/installer-application-red/tests" > "$RUNNER_TEMP/installer-application-red/RESULT.json" 2> "$RUNNER_TEMP/installer-application-red/stderr.log"
        code=$?
        printf '%s\n' "$code" > "$RUNNER_TEMP/installer-application-red/exit.txt"
        exit "$code"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-installer-application-red
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/installer-application-red/*.json
          ${{ runner.temp }}/installer-application-red/*.log
          ${{ runner.temp }}/installer-application-red/*.sha256
          ${{ runner.temp }}/installer-application-red/*.txt
