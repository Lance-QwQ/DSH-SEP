settings-ui-close-diagnostic:
  runs-on: macos-15
  timeout-minutes: 30
  permissions:
    contents: read
    actions: read
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.19.0
    - name: Download exact r28 image package with both archive hashes
      env:
        SEP_ARTIFACT_TOKEN: ${{ github.token }}
      run: node tools/alpha2-macos/settings-ui/download-fixed-r28.mjs "$RUNNER_TEMP/settings-fixed-download"
    - name: Restore and verify original package before diagnostic changes
      run: |
        mkdir "$RUNNER_TEMP/settings-fixed-product"
        ditto -x -k "$RUNNER_TEMP/settings-fixed-download/input/DSH-SEP-macOS-Alpha2-preview.zip" "$RUNNER_TEMP/settings-fixed-product"
        node --input-type=module <<'JS'
        import {readFile,writeFile} from 'node:fs/promises';import {join} from 'node:path';
        import {verifyPackage} from './tools/alpha2-macos/package/package-inventory.mjs';
        const receipt=JSON.parse(await readFile(join(process.env.RUNNER_TEMP,'settings-fixed-download/input/PACKAGE-INVENTORY.json'),'utf8'));
        const result=await verifyPackage(join(process.env.RUNNER_TEMP,'settings-fixed-product/DSH-SEP-macOS-Alpha2-preview'),receipt);
        await writeFile(join(process.env.RUNNER_TEMP,'settings-fixed-download/RESTORE.json'),JSON.stringify(result,null,2)+'\n',{flag:'wx'});
        JS
    - name: Test exact diagnostic transforms and derive one client file
      run: |
        mkdir "$RUNNER_TEMP/settings-close-unit"
        export SEP_SETTINGS_DIAGNOSTIC_SOURCE="$RUNNER_TEMP/settings-fixed-product/DSH-SEP-macOS-Alpha2-preview/payload/host/node_modules/@deepseek-ai/dsh-client-ui-settings-general/lib/client.js"
        node --test --test-reporter=tap tools/alpha2-macos/settings-ui/close-diagnostic.test.mjs tools/alpha2-macos/settings-ui/close-diagnostic-smoke.test.mjs > "$RUNNER_TEMP/settings-close-unit/tests.tap"
        node tools/alpha2-macos/settings-ui/close-diagnostic.mjs "$RUNNER_TEMP/settings-fixed-product/DSH-SEP-macOS-Alpha2-preview" "$RUNNER_TEMP/settings-fixed-download/input/PACKAGE-INVENTORY.json" "$RUNNER_TEMP/settings-close-variant"
    - name: Two predefined cold and same-data cycles on diagnostic variant
      id: close_smoke
      run: |
        node tools/alpha2-macos/settings-ui/close-diagnostic-smoke.mjs "$RUNNER_TEMP/settings-fixed-product/DSH-SEP-macOS-Alpha2-preview/PROGRAM.json" 22457aa1dbc3e9e5f0a0e54907885ba2707b1f5deb6078c8d5c487925d6759de "$RUNNER_TEMP/settings-close-smoke"
    - name: Audit diagnostic product tree after the run
      if: always()
      run: |
        node --input-type=module <<'JS'
        import assert from 'node:assert/strict';import {readFile,writeFile} from 'node:fs/promises';import {join} from 'node:path';
        import {inventoryPackage} from './tools/alpha2-macos/package/package-inventory.mjs';
        const expected=JSON.parse(await readFile(join(process.env.RUNNER_TEMP,'settings-close-variant/RESULT.json'),'utf8'));
        const actual=await inventoryPackage(join(process.env.RUNNER_TEMP,'settings-fixed-product/DSH-SEP-macOS-Alpha2-preview'));
        assert.equal(actual.treeSha256,expected.diagnosticTreeSha256);
        await writeFile(join(process.env.RUNNER_TEMP,'settings-close-variant/POST-RUN.json'),JSON.stringify({status:'pass',scope:'diagnostic tree unchanged by execution',treeSha256:actual.treeSha256,entries:actual.entries.length},null,2)+'\n',{flag:'wx'});
        JS
    - name: Preserve original identity, exact diagnostic delta and all planned results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sep-macos-settings-close-diagnostic
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/settings-close-unit/tests.tap
          ${{ runner.temp }}/settings-fixed-download/DOWNLOAD-RECEIPT.json
          ${{ runner.temp }}/settings-fixed-download/RESTORE.json
          ${{ runner.temp }}/settings-close-variant/*.json
          ${{ runner.temp }}/settings-close-smoke/RESULT.json
          ${{ runner.temp }}/settings-close-smoke/round-*/*.json
          ${{ runner.temp }}/settings-close-smoke/round-*/*.log
          ${{ runner.temp }}/settings-close-smoke/round-*/*.png
